<script>
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    var statusEl = document.getElementById("boot-status");
    if (statusEl) statusEl.style.display = "none";
    box.style.display = "block";
    box.textContent =
      "Something failed to load. Screenshot this and send it back:\n\n" +
      (e.message || "Unknown error") +
      "\n\nFile: " + (e.filename || "n/a") + "\nLine: " + (e.lineno || "n/a") + ":" + (e.colno || "n/a") +
      (e.error && e.error.stack ? "\n\n" + e.error.stack : "");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var box = document.getElementById("boot-error");
    var statusEl = document.getElementById("boot-status");
    if (statusEl) statusEl.style.display = "none";
    box.style.display = "block";
    box.textContent = "Something failed to load (promise error). Screenshot this:\n\n" + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
  });

  window.storage = {
    get: async (key, shared) => {
      const raw = localStorage.getItem((shared ? "shared:" : "local:") + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: !!shared };
    },
    set: async (key, value, shared) => {
      try {
        localStorage.setItem((shared ? "shared:" : "local:") + key, value);
        return { key, value, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    delete: async (key, shared) => {
      localStorage.removeItem((shared ? "shared:" : "local:") + key);
      return { key, deleted: true, shared: !!shared };
    },
    list: async (prefix, shared) => {
      const p = (shared ? "shared:" : "local:") + (prefix || "");
      const keys = Object.keys(localStorage)
        .filter((k) => k.startsWith(p))
        .map((k) => k.slice((shared ? "shared:" : "local:").length));
      return { keys, prefix, shared: !!shared };
    },
  };
  window.CHAT_ENDPOINT = "/.netlify/functions/chat";
</script>

  recipes: [
    { id: "r1", name: "Ricotta Mix", steps: "4 containers of ricotta cheese\n2 heavy pinches of crushed parsley\n1/4 souffl\xE9 of salt and pepper mix\n1 full souffl\xE9 of granulated garlic\n\nMix thoroughly." },
    { id: "r2", name: "Roma (Tomato Prep)", steps: "4 cans of 74/40 tomato strips\nStrain in bus tub for 10\u201315 minutes to remove excess water\nGently fold tomatoes over by hand in the strainer to preserve strips \u2014 do not crush\n1/4 souffl\xE9 of salt and pepper mix\n1/2 souffl\xE9 of sugar\n\nMix gently." },
    { id: "r3", name: "Pizza Sauce", steps: "3 cases of Tomato Magic\n16 oz garlic oil\n1 cup salt and pepper mix\n\nMix well until fully combined." },
    { id: "r4", name: "Dough", steps: "2 8-quart containers of cold water (second one just above handles)\nSmall amount of hot water (105\u2013110\xB0F) in a 2-quart container\nDissolve 28g yeast in hot water\n\nAdd to mixer bowl:\n\u2022 Both cold waters\n\u2022 1 scoop salt\n\u2022 1 scoop sugar\n\nAdd frothy yeast mixture to bowl\nAdd 1 bag of flour\nSet dough machine to speed #1\nKeep olive oil nearby\nAs dough begins to come together, pour 1/4 container of olive oil around bowl and hook\nMix 8 minutes total, or until dough pulls off hook and appears smooth and slightly wrinkled\nOptional: Add splash of cold water if dough feels too tight\nLower bowl and cover with apron to rest" },
    { id: "r5", name: "Garlic Butter", steps: "4 lbs butter, melted and clarified\nEqual part garlic oil (approx. 4 lbs or equal volume)\n2 heavy pinches crushed parsley\n2 heavy pinches salt and pepper mix\n\nStir to combine." },
    { id: "r6", name: "Buffalo Sauce", steps: "Equal parts Frank's RedHot and Frank's Extra Hot\nClarify melted butter by letting solids settle and pouring off top layer\nMix clarified butter into hot sauce mixture\nAdd 1 cup Romano cheese\nStir thoroughly." }

        { className: "text-xs px-2 py-0.5 rounded-full", style: { background: COLORS.crust, color: COLORS.parm, fontFamily: "Inter" } },
        t.assignee || "Anyone"
      ),
      React.createElement(
        "select",
        {
          value: stationOf(t),
          onChange: (e) => move(t.id, e.target.value),
          className: "text-xs px-1 py-1 rounded outline-none",
          style: { border: `1px solid ${COLORS.line}`, fontFamily: "Inter", background: "white", maxWidth: "90px" }
        },
        allStations.map((s) => React.createElement("option", { key: s, value: s }, s))
      ),
      React.createElement("button", { onClick: () => remove(t.id) }, React.createElement(Trash2, { size: 14, color: "#999" }))
    )
  );

  return React.createElement(
    "div",
    null,
    React.createElement(
      "div",
      { className: "flex gap-1.5 mb-3 overflow-x-auto pb-1" },
      chip("All", data.tasks.filter((t) => !t.done).length, filter === "All"),
      allStations.map((s) => chip(s, openCount(s), filter === s))
    ),
    React.createElement(
      "div",
      { className: "flex gap-1.5 mb-4 flex-wrap" },
      React.createElement("input", {
        placeholder: "New task...",
        value: text,
        onChange: (e) => setText(e.target.value),
        onKeyDown: (e) => e.key === "Enter" && add(),
        className: "flex-1 text-sm px-2.5 py-2 rounded outline-none",
        style: { border: `1px solid ${COLORS.line}`, fontFamily: "Inter", minWidth: "140px" }
      }),
      React.createElement(
        "select",
        {
          value: station,
          onChange: (e) => setStation(e.target.value),
          className: "text-sm px-2 py-2 rounded outline-none",
          style: { border: `1px solid ${COLORS.line}`, fontFamily: "Inter", background: "white" }
        },
        TASK_STATIONS.map((s) => React.createElement("option", { key: s, value: s }, s))
      ),
      React.createElement("input", {
        placeholder: "Who",
        value: assignee,
        onChange: (e) => setAssignee(e.target.value),
        className: "w-20 text-sm px-2.5 py-2 rounded outline-none",
        style: { border: `1px solid ${COLORS.line}`, fontFamily: "Inter" }
      }),
      React.createElement(TicketButton, { onClick: add, color: COLORS.basil }, React.createElement(Plus, { size: 14 }))
    ),
    shown.map((s) => {
      const items = data.tasks.filter((t) => !t.done && stationOf(t) === s);
      if (items.length === 0 && filter === "All") return null;
      return React.createElement(
        "div",
        { key: s, className: "mb-4" },
        React.createElement(
          "div",
          { className: "text-xs mb-1.5 tracking-widest flex items-center gap-2", style: { fontFamily: "Oswald", color: COLORS.tomato, fontWeight: 600 } },
          s.toUpperCase(),
          React.createElement("span", { style: { flex: 1, height: "1px", background: COLORS.line } })
        ),
        items.length === 0
          ? React.createElement("div", { className: "text-xs italic", style: { fontFamily: "Inter", color: "#999" } }, "Nothing open at this station.")
          : React.createElement("div", { className: "space-y-1.5" }, items.map(taskRow))
      );
    }),
    data.tasks.filter((t) => !t.done).length === 0 && React.createElement(
      "div",
      { className: "text-sm italic py-4 text-center", style: { fontFamily: "Inter", color: "#999" } },
      "All caught up \u2014 every station clear."
    ),
    doneTasks.length > 0 && React.createElement(
      "div",
      { className: "mt-5 pt-3", style: { borderTop: `1px solid ${COLORS.line}` } },
      React.createElement(
        "div",
        { className: "flex items-center justify-between mb-1.5" },
        React.createElement("div", { className: "text-xs tracking-widest", style: { fontFamily: "Oswald", color: "#999" } }, "DONE"),
        React.createElement(
          "button",
          { onClick: clearDone, className: "text-xs underline", style: { fontFamily: "Inter", color: "#999" } },
          "Clear finished"
        )
      ),
      React.createElement(
        "div",
        { className: "space-y-1.5" },
        doneTasks.map((t) => React.createElement(
          "div",
          { key: t.id, className: "flex items-center justify-between px-3 py-2 rounded opacity-60", style: { background: COLORS.card } },
          React.createElement(
            "div",
            { className: "flex items-center gap-2.5 min-w-0" },
            React.createElement(
              "button",
              { onClick: () => toggle(t.id), className: "w-5 h-5 rounded flex items-center justify-center flex-shrink-0", style: { background: COLORS.basil } },
              React.createElement(Check, { size: 12, color: "white" })
            ),
            React.createElement("span", { className: "text-sm line-through truncate", style: { fontFamily: "Inter", color: COLORS.crust } }, t.text),
            React.createElement("span", { className: "text-xs flex-shrink-0", style: { fontFamily: "Inter", color: "#aaa" } }, stationOf(t))
          ),
          React.createElement("button", { onClick: () => remove(t.id) }, React.createElement(Trash2, { size: 13, color: "#999" }))
        ))
      )
    )
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(PizzaOpsManager));
const bootStatus = document.getElementById("boot-status");
if (bootStatus) bootStatus.style.display = "none";
</script>
</body>
</html>
