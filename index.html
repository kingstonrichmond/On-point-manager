<script>
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    var statusEl = document.getElementById("boot-status");
    if (statusEl) statusEl.style.display = "none";
    box.style.display = "block";
    box.textContent =
      "Something failed to load. Screenshot this and send it back:\n\n" +
      (e.message || "Unknown error") +
      "\n\nFile: " + (e.filename || "n/a") + "\nLine: " + (e.lineno || "n/a") + ":" + (e.colno || "n/a") +
      (e.error && e.error.stack ? "\n\n" + e.error.stack : "");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var box = document.getElementById("boot-error");
    var statusEl = document.getElementById("boot-status");
    if (statusEl) statusEl.style.display = "none";
    box.style.display = "block";
    box.textContent = "Something failed to load (promise error). Screenshot this:\n\n" + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
  });

  window.storage = {
    get: async (key, shared) => {
      const raw = localStorage.getItem((shared ? "shared:" : "local:") + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: !!shared };
    },
    set: async (key, value, shared) => {
      try {
        localStorage.setItem((shared ? "shared:" : "local:") + key, value);
        return { key, value, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    delete: async (key, shared) => {
      localStorage.removeItem((shared ? "shared:" : "local:") + key);
      return { key, deleted: true, shared: !!shared };
    },
    list: async (prefix, shared) => {
      const p = (shared ? "shared:" : "local:") + (prefix || "");
      const keys = Object.keys(localStorage)
        .filter((k) => k.startsWith(p))
        .map((k) => k.slice((shared ? "shared:" : "local:").length));
      return { keys, prefix, shared: !!shared };
    },
  };
  window.CHAT_ENDPOINT = "/.netlify/functions/chat";
  window.SYNC_URL = "/.netlify/functions/data";
  window.MEDIA_URL = "/.netlify/functions/media";
  window.YOLINK_URL = "/.netlify/functions/yolink";
</script>

  recipes: [
    { id: "r1", name: "Ricotta Mix", steps: "4 containers of ricotta cheese\n2 heavy pinches of crushed parsley\n1/4 souffl\xE9 of salt and pepper mix\n1 full souffl\xE9 of granulated garlic\n\nMix thoroughly." },
    { id: "r2", name: "Roma (Tomato Prep)", steps: "4 cans of 74/40 tomato strips\nStrain in bus tub for 10\u201315 minutes to remove excess water\nGently fold tomatoes over by hand in the strainer to preserve strips \u2014 do not crush\n1/4 souffl\xE9 of salt and pepper mix\n1/2 souffl\xE9 of sugar\n\nMix gently." },
    { id: "r3", name: "Pizza Sauce", steps: "3 cases Tomato Magic (18 cans total, 6 per case)\n1 full 12 oz cup salt & pepper mix\n1 quart cold water\n1.5 liters garlic oil\n\n1. Empty all 18 cans into the large mixing pot.\n2. In a separate container, mix 1 quart cold water with the full 12 oz cup of salt & pepper mix.\n3. Stir into a slurry.\n4. Pour the slurry into the tomatoes.\n5. Add 1.5 liters garlic oil.\n6. Stir thoroughly with the long stainless paddle until fully combined.\n7. Portion into containers, lid them, date-label and refrigerate.\n\nMix all the way to the bottom so the oil and seasoning are fully combined." },
    { id: "r4", name: "Dough", steps: "0.25 L warm water (100\u2013110\u00B0F)\n28 g yeast\n6 L cold water\n7.5 L cold water\n1 full 12 oz cup salt\n1 x 50 lb bag flour (less 1 shallow 1/6 pan scoop)\nOlive oil (small amount)\n\n1. Bloom the yeast: 28 g yeast into 0.25 L warm water. Mix gently with your finger, let sit 5\u201310 min until frothy.\n2. Set the water, yeast and salt aside so nothing gets forgotten.\n3. Put 6 L and 7.5 L cold water into the empty mixer bowl. Use the hook attachment.\n4. Remove 1 shallow 1/6 pan scoop of flour from the bag, then add the rest to the bowl.\n5. Start on LEVEL 1 so the flour does not fly. Once it is mixing, pour in the bloomed yeast.\n6. Add 0.25 L cold water to the yeast container, swirl with your finger to get the leftover yeast, pour it in.\n7. Pour in the full 12 oz cup of salt while the dough is mixing.\n8. Mix about 8 minutes. Add a little olive oil around the outside of the dough. Turn the mixer off so it does not stick.\n\nMixer stays on Level 1. Cold water as cold as it gets. Removing the scoop of flour helps hydration." }, { id: "r5", name: "Garlic Butter", steps: "4 lbs butter, melted and clarified\nEqual part garlic oil (approx. 4 lbs or equal volume)\n2 heavy pinches crushed parsley\n2 heavy pinches salt and pepper mix\n\nStir to combine." },
    { id: "r6", name: "Buffalo Sauce", steps: "1 gallon Frank's Original RedHot\n1 gallon Frank's Extra Hot RedHot\n4 lb butter\n1 full 12 oz cup romano cheese\n\n1. Melt 4 lb butter on low heat.\n2. Let it simmer 5\u201310 minutes max.\n3. Off the heat, ladle off most of the white foam and solids from the top. A little left behind is fine.\n4. Pour both gallons of Frank's into a 12-quart container.\n5. Pour in the melted butter, but STOP when you reach the watery liquid at the bottom \u2014 discard that.\n6. Whisk the hot sauce and butter together well so the butter is not sitting on top.\n7. Add the romano a little at a time, about 1/4 cup per addition, whisking after each, until the full 12 oz cup is mixed in.\n8. Pour the finished sauce back into the bottles or containers.\n\nGoal: smooth and well mixed, with no hot butter floating on top." }

// Row density is a per-tablet choice, not a shop-wide one: the kitchen screen
// wants big rows you can read from the line, the office phone wants to see the
// whole list. Stored device-local and broadcast so open tabs re-render at once.
const DENSITY_KEY = "opp:density";
function getDensity() {
  try { return localStorage.getItem(DENSITY_KEY) === "compact" ? "compact" : "comfortable"; }
  catch (e) { return "comfortable"; }
}
function setDensityPref(v) {
  try { localStorage.setItem(DENSITY_KEY, v); } catch (e) {}
  try { window.dispatchEvent(new Event("opp:density")); } catch (e) {}
}
function useDensity() {
  const [d, setD] = useState(getDensity);
  useEffect(() => {
    const h = () => setD(getDensity());
    window.addEventListener("opp:density", h);
    return () => window.removeEventListener("opp:density", h);
  }, []);
  return d;
}
